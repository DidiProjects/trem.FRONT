name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Test, build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npm run test:run

      - name: Build
        env:
          VITE_API_URL: ${{ vars.TREM_API_URL }}
          # authentik's trem provider: the only login.
          VITE_OIDC_ISSUER: ${{ vars.OIDC_ISSUER }}
        run: |
          [[ "$VITE_API_URL" == https://* ]] || { echo "Repository variable TREM_API_URL must be trem.API's https origin"; exit 1; }
          [[ "$VITE_OIDC_ISSUER" == https://* ]] || { echo "Repository variable OIDC_ISSUER must be authentik's trem issuer"; exit 1; }
          npm run build

      - name: Deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        # --no-build: netlify-cli builds by default, again and without the VITE_* variables,
        # overwriting the dist/ built and tested above (the site shipped localhost:3002).
        run: npx --yes netlify-cli deploy --dir=./dist --prod --no-build
