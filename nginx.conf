server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # add_header in a location would drop these, so the locations set caching with expires.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Not in nginx's mime.types: browsers want this type to read it as a web app manifest.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires -1;
    }

    # Hashed file names: a new build gets new names, so the old ones can be cached for good.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Client-side routes (/account, /admin/...) are served by index.html, revalidated on
    # every visit so a deploy reaches open browsers on the next navigation.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
